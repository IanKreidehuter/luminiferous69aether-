<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Admin – Fahlan Aditya</title>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.adm{max-width:1040px;margin:0 auto;padding:14px;display:grid;gap:16px}
.adm h1{font-size:clamp(34px,6vw,52px);color:var(--purple);transform:rotate(-2deg)}
#msg{margin:0;padding:8px 14px;border-radius:12px;font-size:19px}#msg:empty{display:none}.ok{background:var(--mint)}.bad{background:#ffd1d1}
form{display:grid;gap:10px}label{display:grid;gap:3px;font-size:18px;min-width:0}
input,select,textarea{font:inherit;padding:8px 10px;border:2px dashed #a9d2f2;border-radius:10px;background:#fff;color:var(--ink);width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{font:inherit;padding:8px 18px;min-height:42px;border-radius:99px;border:2px solid #fff;box-shadow:2px 3px 0 rgba(60,50,90,.2);cursor:pointer;background:var(--mint);color:var(--ink)}
.b.pub{background:var(--pink)}.b.del{background:#ffd1d1}.b.ghost{background:#fff}.b:disabled{opacity:.5;cursor:wait}
#preview{max-height:180px;border-radius:8px;justify-self:start}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.item{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;padding:8px 12px;border-radius:12px;box-shadow:2px 3px 0 rgba(60,50,90,.1)}
.item b{font-weight:400;font-size:20px;overflow-wrap:anywhere}.item small{display:block;opacity:.7}
.chip{font-size:14px;padding:1px 10px;border-radius:99px;background:var(--butter)}.chip.pub{background:var(--mint)}
@media(min-width:860px){.main{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}}
@media(max-width:520px){.two{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="admin-fx.css">
</head>
<body>
<div class="adm">
  <h1>Post Admin</h1>
  <p id="msg" role="status" aria-live="polite"></p>

  <section id="login" class="card">
    <h2>Log in</h2>
    <form id="loginForm">
      <label>Admin token<input id="tok" type="password" autocomplete="current-password" required></label>
      <div class="btns"><button class="b" type="submit">Enter</button><a class="b ghost" href="index.html" style="text-decoration:none">Back to site</a></div>
    </form>
  </section>

  <div id="panel" class="main" hidden>
    <section class="card">
      <h2 id="formTitle">New post</h2>
      <form id="form">
        <div class="two">
          <label>Type<select id="type"><option value="image">Image only</option><option value="image_text">Image + Text</option><option value="text">Text only</option><option value="link">Link / Media</option></select></label>
          <label>Date<input id="date" type="date"></label>
        </div>
        <label>Title<input id="title" maxlength="120"></label>
        <label data-t="image_text text link">Text / description<textarea id="content"></textarea></label>
        <label data-t="link">Link URL<input id="linkUrl" type="url" placeholder="https://"></label>
        <div data-t="image image_text link" class="two">
          <label>Image file<input id="file" type="file" accept="image/*"></label>
          <label>or image URL<input id="imageUrl" placeholder="filled in after upload"></label>
        </div>
        <img id="preview" alt="Preview" hidden>
        <label>Category (optional)<input id="category" maxlength="40"></label>
        <div class="btns">
          <button class="b" type="button" id="saveDraft">Save draft</button>
          <button class="b pub" type="button" id="publish">Publish</button>
          <button class="b ghost" type="button" id="clear">New / clear</button>
        </div>
      </form>
    </section>
    <section class="card">
      <div class="btns" style="justify-content:space-between;align-items:center"><h2>All posts</h2><button class="b ghost" type="button" id="logout">Log out</button></div>
      <ul id="list" class="list"></ul>
    </section>
  </div>
</div>
<script src="config.js"></script><script src="admin.js"></script><script src="admin-fx.js" defer></script>
</body>
</html>
