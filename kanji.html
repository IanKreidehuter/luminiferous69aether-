<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanji Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b3452;--pink:#ffd3e6;--sky:#bfe3ff;--mint:#d6f5d2;--butter:#fff0a6;--lav:#dccbff;--red:#ff4a5f;--purple:#8c5bd8;
 --wob:14px 24px 16px 22px/22px 14px 24px 16px;--bg:url("https://iankreidehuter.space/assets/background.jpg")}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:19px/1.3 "Patrick Hand","Comic Sans MS",cursive;color:var(--ink);min-height:100vh;overflow-x:hidden;background:#c6e5ff}
:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
h1,h2{font-family:"Gochi Hand",cursive;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
[lang=ja]{font-family:"Yusei Magic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
.bg-layer{position:fixed;inset:0;z-index:-2;background:var(--bg) center/cover no-repeat,#c6e5ff}
.bg-overlay{position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(118deg,transparent 0 5px,rgba(255,255,255,.35) 5px 7px),rgba(255,255,255,.22)}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx-s{position:absolute;height:auto;animation:bob 5s ease-in-out var(--d,0s) infinite}.fx-s.tw{animation:tw 2.6s ease-in-out var(--d,0s) infinite}.fx-s.spin{animation:spin 30s linear infinite}
.page{position:relative;z-index:1;display:flex;justify-content:center;padding:40px 14px 90px}
.wrap{width:100%;max-width:1080px;display:grid;gap:20px}
.paper{position:relative;background:#fffdf8;border:3px solid #fff;border-radius:var(--wob);box-shadow:0 0 0 2px #a9d2f2,3px 5px 0 rgba(60,50,90,.12)}
.paper::before{content:"";position:absolute;top:-11px;left:50%;width:78px;height:20px;transform:translateX(-50%) rotate(-3deg);background:repeating-linear-gradient(90deg,#ffb3c9 0 8px,#fff 8px 16px);opacity:.88;pointer-events:none}
header{padding:20px 24px 18px;display:grid;gap:10px;animation:pop .6s both}
h1{font-size:clamp(34px,7vw,54px);line-height:1;color:var(--red);text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(140,91,216,.3)}
.sub{font-size:20px}.lvl{display:inline-block;padding:0 14px;border-radius:99px;background:var(--butter);font-size:17px}
.bar{height:20px;border:3px solid #fff;border-radius:99px;background:#fff;overflow:hidden;box-shadow:2px 3px 0 rgba(60,50,90,.15)}
.bar b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff8ac0,#ffd75e,#8de08d);transition:width .5s}
.pc{font-size:18px}
details{font-size:16px}summary{cursor:pointer;color:var(--purple)}details p{margin-top:6px}
.modes{display:flex;flex-wrap:wrap;gap:10px}
.modes button,.btn{padding:8px 18px;border:2px solid #fff;border-radius:99px;background:#eef4ff;box-shadow:2px 3px 0 rgba(60,50,90,.18);transition:transform .2s}
.modes button[aria-selected=true]{background:var(--pink);box-shadow:2px 3px 0 var(--purple)}
.btn.go{background:var(--mint)}.btn.alt{background:var(--lav)}
@media(hover:hover){.modes button:hover,.btn:hover{transform:translateY(-2px) rotate(-1deg)}}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
#q{flex:1 1 200px;min-width:0;padding:8px 14px;font:inherit;font-size:20px;color:var(--ink);background:#fff;border:3px dashed #a9d2f2;border-radius:var(--wob);outline:none}#q:focus{border:3px solid var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{padding:2px 14px;border:2px solid #fff;border-radius:99px;background:#eef4ff;font-size:17px}.chips button[aria-pressed=true]{background:var(--pink);box-shadow:2px 2px 0 var(--purple)}
.state{padding:26px;text-align:center;background:var(--lav);border-radius:var(--wob);font-size:21px}.state .btn{margin-top:12px;display:inline-block}
/* study cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px 16px}
.kc{--h:var(--pink);--b:#ff9ec6;background:#fffdf8;border:3px solid var(--b);border-radius:var(--wob);overflow:hidden;box-shadow:3px 5px 0 rgba(60,50,90,.12);animation:pop .5s both;content-visibility:auto;contain-intrinsic-size:auto 300px}
.t1{--h:var(--sky);--b:#7fc0ee}.t2{--h:var(--mint);--b:#7fcf86}.t3{--h:var(--butter);--b:#f0c63c}.t4{--h:var(--lav);--b:#b79af0}
.kh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;background:var(--h)}
.kj{font-size:68px;line-height:1.05;text-shadow:2px 2px 0 #fff}
.mn{display:block;font-family:"Gochi Hand",cursive;font-size:24px;line-height:1.1}
.rd{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;gap:6px;align-items:baseline;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.75);font-size:16px}.chip b{font-weight:400;font-size:13px;color:var(--purple)}
.kn{width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:#fff;font-size:22px;filter:grayscale(1);opacity:.55;box-shadow:2px 3px 0 rgba(60,50,90,.2);transition:transform .25s,filter .25s}
.kn[aria-pressed=true]{filter:none;opacity:1;background:var(--butter);transform:rotate(12deg) scale(1.08)}
.kb{padding:8px 14px 12px}.lt{margin:6px 0 2px;font-family:"Gochi Hand",cursive;font-size:20px}
.wl{list-style:none;display:grid;gap:4px}
.wl li{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center}
.wl ruby{font-size:24px}.wl rt{font-size:12px;color:var(--purple)}.wm{font-size:16px;opacity:.8}
.sp{display:none;width:30px;height:30px;border:0;border-radius:50%;background:var(--sky);font-size:14px}.tts .sp{display:block}
/* flashcards */
.fl{display:grid;gap:14px;justify-items:center}
.fc{width:min(100%,560px);height:min(66vh,440px);perspective:1200px;cursor:pointer}
.fcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-content:center;justify-items:center;gap:8px;padding:18px;text-align:center;background:#fffdf8;border:4px solid var(--b);border-radius:var(--wob);box-shadow:3px 5px 0 rgba(60,50,90,.15)}
.face.back{transform:rotateY(180deg);background:var(--h);place-content:start center}
.big{font-size:min(38vw,190px);line-height:1}.tap{font-size:16px;opacity:.65}
.fbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
/* quiz */
.qz{max-width:620px;margin:0 auto;padding:24px 22px;display:grid;gap:14px;text-align:center}
.qn{font-size:17px;opacity:.7}.qp{font-family:"Gochi Hand",cursive;font-size:36px;line-height:1.1;color:var(--purple)}.qp.big{font-family:"Yusei Magic",sans-serif;font-size:110px;color:var(--ink);text-shadow:3px 3px 0 var(--pink)}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{padding:12px 10px;min-height:58px;font-size:20px;background:#fff;border:3px solid #cfe3f5;border-radius:var(--wob);transition:transform .2s}
.opt[lang=ja]{font-size:40px}.opt.good{background:var(--mint);border-color:#7fcf86;animation:pop .4s}.opt.bad{background:#ffd1d1;border-color:#ff8a9b}.opt:disabled{cursor:default}
.qf{min-height:70px;font-size:22px}.sc{font-family:"Gochi Hand",cursive;font-size:60px;color:var(--red)}
.wrongs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.wrongs span{padding:0 12px;font-size:28px;background:var(--pink);border-radius:var(--wob)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-9px) rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes tw{0%,100%{transform:scale(1) rotate(var(--r,0deg));opacity:1}50%{transform:scale(1.2) rotate(calc(var(--r,0deg) + 12deg));opacity:.7}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.qo{grid-template-columns:1fr}.kj{font-size:60px}header{padding:18px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-layer"></div><div class="bg-overlay"></div>
<main class="page"><div class="wrap">
  <header class="paper">
    <div><h1 id="ttl">Kanji Study</h1></div>
    <p class="sub"><span class="lvl" id="lvl">...</span> Look · Say · Remember</p>
    <div class="bar" role="progressbar" aria-label="Kanji you know" id="pbar"><b id="pfill"></b></div>
    <p class="pc" id="ptxt"></p>
    <details><summary>About this list</summary><p id="note"></p></details>
    <nav class="modes" role="tablist" aria-label="Study mode">
      <button type="button" role="tab" data-m="study" aria-selected="true">📖 Cards</button>
      <button type="button" role="tab" data-m="flash" aria-selected="false">🃏 Flashcards</button>
      <button type="button" role="tab" data-m="quiz" aria-selected="false">🎯 Quiz</button>
      <label class="btn alt" title="Load a different kanji JSON file">📂 Load JSON<input id="pick" type="file" accept=".json,application/json" hidden></label>
    </nav>
  </header>
  <div class="tools paper" id="tools"><input id="q" type="search" placeholder="Search kanji, reading or meaning…" aria-label="Search"><div class="chips" id="chips" role="group" aria-label="Filter"></div></div>
  <div id="state" class="state" role="status" aria-live="polite">Loading kanji…</div>
  <section id="vStudy" class="grid" hidden></section>
  <section id="vFlash" class="fl" hidden></section>
  <section id="vQuiz" class="qz paper" hidden></section>
</div></main>
<script>
(() => {
  /* ---- settings ---- */
  const CFG = { data: ["https://iankreidehuter.space/assets/jlpt_n4_kanji_study_list.json", "assets/jlpt_n4_kanji_study_list.json", "../assets/jlpt_n4_kanji_study_list.json"],
                assets: "https://iankreidehuter.space/assets/" };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const arr = a => Array.isArray(a) ? a.map(String) : [];
  const wl = a => Array.isArray(a) ? a.filter(w => w && w.word).map(w => ({word: String(w.word), reading: String(w.reading || ""), meaning: String(w.meaning || "")})) : [];
  const hira = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).toLowerCase();
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let D = {}, K = [], known = new Set(), mode = "study", flt = "all", fdeck = [], fi = 0, shuf = false, qz = null;
  const KEY = () => "kanjiKnown:" + (D.level || D.title || "list");
  if ("speechSynthesis" in window) document.documentElement.classList.add("tts");
  const say = t => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "ja-JP"; u.rate = .8; speechSynthesis.speak(u); } catch (e) {} };

  function init(d) {
    D = d;
    K = (d.kanji || []).filter(k => k && k.kanji).map(k => {
      const o = {kanji: String(k.kanji), meaning: String(k.meaning || ""), onyomi: arr(k.onyomi), kunyomi: arr(k.kunyomi), words: wl(k.standalone_words), combos: wl(k.combinations)};
      o.hay = hira([o.kanji, o.meaning, ...o.onyomi, ...o.kunyomi, ...o.words.concat(o.combos).flatMap(w => [w.word, w.reading, w.meaning])].join(" "));
      return o;
    });
    if (!K.length) return fail("That file has no kanji in it.");
    try { known = new Set(JSON.parse(localStorage.getItem(KEY()) || "[]")); } catch (e) { known = new Set(); }
    $("#ttl").textContent = d.title || "Kanji Study"; $("#lvl").textContent = d.level || "Kanji";
    $("#note").textContent = d.note || "Tap a card's star when you know that kanji. Your stars are saved on this device.";
    document.title = (d.title || "Kanji Study");
    flt = "all"; $("#q").value = ""; chips(); progress(); setMode(mode, true);
  }
  const save = () => { try { localStorage.setItem(KEY(), JSON.stringify([...known])); } catch (e) {} };
  const fail = (m) => { $("#state").hidden = false; $("#state").innerHTML = esc(m) + '<br><label class="btn go">📂 Choose the JSON file<input type="file" accept=".json,application/json" hidden id="pick2"></label>'; ["#vStudy", "#vFlash", "#vQuiz", "#tools"].forEach(s => $(s).hidden = true); };

  function progress() {
    const n = known.size, t = K.length, p = t ? Math.round(100 * n / t) : 0;
    $("#pfill").style.width = p + "%"; $("#pbar").setAttribute("aria-valuenow", p);
    $("#ptxt").textContent = `${n} / ${t} kanji known ⭐` + (n === t && t ? " — you did it! 🎉" : "");
  }
  function chips() {
    const L = K.filter(k => !known.has(k.kanji)).length, items = [["all", "All " + K.length], ["learn", "Learning " + L], ["known", "Known " + (K.length - L)]];
    $("#chips").innerHTML = items.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${k === flt}">${l}</button>`).join("");
  }
  const inFilter = k => flt === "all" || (flt === "known") === known.has(k.kanji);
  const list = (t, a) => a.length ? `<p class="lt">${t}:</p><ul class="wl">${a.map(w => `<li><button type="button" class="sp" data-say="${esc(w.reading || w.word)}" aria-label="Listen to ${esc(w.word)}">🔊</button><ruby lang="ja">${esc(w.word)}<rt>${esc(w.reading)}</rt></ruby><span class="wm">${esc(w.meaning)}</span></li>`).join("")}</ul>` : "";
  const reads = k => (k.onyomi.length ? `<span class="chip"><b>音 on</b><span lang="ja">${k.onyomi.map(esc).join("・")}</span></span>` : "") + (k.kunyomi.length ? `<span class="chip"><b>訓 kun</b><span lang="ja">${k.kunyomi.map(esc).join("・")}</span></span>` : "");
  const star = k => `<button type="button" class="kn" data-k="${esc(k.kanji)}" aria-pressed="${known.has(k.kanji)}" aria-label="I know ${esc(k.kanji)}" title="I know it!">⭐</button>`;
  const body = k => list("Words", k.words) + list("Mix & match", k.combos);

  function study() {
    const q = hira($("#q").value.trim()), v = K.filter(k => inFilter(k) && k.hay.includes(q));
    $("#vStudy").innerHTML = v.map((k, i) => `<article class="kc t${i % 5}" style="animation-delay:${Math.min(i, 10) * 40}ms"><div class="kh"><div class="kj" lang="ja">${esc(k.kanji)}</div><div><span class="mn">${esc(k.meaning)}</span><div class="rd">${reads(k)}</div></div>${star(k)}</div><div class="kb">${body(k) || '<p class="wm">No example words yet.</p>'}</div></article>`).join("");
    $("#state").hidden = v.length > 0; if (!v.length) $("#state").textContent = "No kanji match. Try another search!";
  }
  function flashDeck() { fdeck = K.filter(inFilter); if (shuf) shuffle(fdeck); fi = Math.min(fi, Math.max(fdeck.length - 1, 0)); flash(); }
  function flash() {
    const k = fdeck[fi], box = $("#vFlash");
    $("#state").hidden = !!k; if (!k) { $("#state").textContent = "Nothing here. Pick another filter!"; box.innerHTML = ""; return; }
    box.innerHTML = `<div class="fc kc t${fi % 5}" id="fc" tabindex="0" role="button" aria-label="Flip card" style="animation:none;box-shadow:none;border:0;background:none;overflow:visible"><div class="fcard" id="fcard">
      <div class="face"><div class="big" lang="ja">${esc(k.kanji)}</div><p class="tap">tap to flip ↻</p></div>
      <div class="face back"><div class="kj" lang="ja">${esc(k.kanji)}</div><span class="mn">${esc(k.meaning)}</span><div class="rd" style="justify-content:center">${reads(k)}</div>${body(k)}</div></div></div>
      <div class="fbar"><button type="button" class="btn" data-f="prev">◀ Back</button><span>${fi + 1} / ${fdeck.length}</span><button type="button" class="btn" data-f="next">Next ▶</button>
      <button type="button" class="btn alt" data-f="shuf">🔀 ${shuf ? "Shuffled" : "Shuffle"}</button><button type="button" class="btn go" data-f="know">${known.has(k.kanji) ? "⭐ Known" : "☆ I know it"}</button></div>`;
  }
  const flip = () => { const c = $("#fcard"); if (c) c.classList.toggle("flip"); };
  const goF = d => { if (!fdeck.length) return; fi = (fi + d + fdeck.length) % fdeck.length; flash(); };

  function startQuiz() {
    if (K.length < 4) { $("#vQuiz").textContent = "Need at least 4 kanji to play."; return; }
    qz = {qs: shuffle(K.slice()).slice(0, 10), i: 0, score: 0, wrong: []}; ask();
  }
  function ask() {
    if (qz.i >= qz.qs.length) return result();
    const q = qz.qs[qz.i], rev = Math.random() < .4;
    const opts = shuffle([q, ...shuffle(K.filter(k => k !== q && k.meaning !== q.meaning)).slice(0, 3)]);
    $("#vQuiz").innerHTML = `<p class="qn">Question ${qz.i + 1} / ${qz.qs.length}</p><div class="qp${rev ? "" : " big"}" ${rev ? "" : 'lang="ja"'}>${esc(rev ? q.meaning : q.kanji)}</div>
      <p>${rev ? "Which kanji is this?" : "What does it mean?"}</p><div class="qo">${opts.map(o => `<button type="button" class="opt" ${rev ? 'lang="ja"' : ""} data-ok="${o === q}">${esc(rev ? o.kanji : o.meaning)}</button>`).join("")}</div><div class="qf" id="qf"></div>`;
  }
  function result() {
    const n = qz.qs.length, s = qz.score, msg = s >= n * .9 ? "Amazing!! 🌈" : s >= n * .6 ? "Great job! ⭐" : "Nice try! Keep going 💪";
    qz.wrong.forEach(k => known.delete(k.kanji)); save(); progress(); chips();
    $("#vQuiz").innerHTML = `<p class="sc">${s} / ${n}</p><p style="font-size:26px">${msg}</p>${qz.wrong.length ? `<p>Practise these:</p><div class="wrongs">${qz.wrong.map(k => `<span lang="ja" title="${esc(k.meaning)}">${esc(k.kanji)}</span>`).join("")}</div>` : "<p>No mistakes!</p>"}
      <div class="fbar"><button type="button" class="btn go" data-q="again">🔁 Play again</button><button type="button" class="btn" data-q="cards">📖 Back to cards</button></div>`;
  }
  function setMode(m, force) {
    if (m === mode && !force) return; mode = m;
    document.querySelectorAll(".modes [data-m]").forEach(b => b.setAttribute("aria-selected", b.dataset.m === m));
    $("#vStudy").hidden = m !== "study"; $("#vFlash").hidden = m !== "flash"; $("#vQuiz").hidden = m !== "quiz"; $("#tools").hidden = m === "quiz"; $("#q").hidden = m !== "study";
    $("#state").hidden = true;
    if (m === "study") study(); else if (m === "flash") flashDeck(); else startQuiz();
  }

  /* ---- events ---- */
  document.addEventListener("click", e => {
    const t = e.target, sp = t.closest(".sp"); if (sp) return say(sp.dataset.say);
    const kn = t.closest(".kn"); if (kn) { const k = kn.dataset.k; known.has(k) ? known.delete(k) : known.add(k); save(); progress(); chips(); if (flt === "all") kn.setAttribute("aria-pressed", known.has(k)); else study(); return; }
    const md = t.closest("[data-m]"); if (md) return setMode(md.dataset.m);
    const ch = t.closest("#chips button"); if (ch) { flt = ch.dataset.k; chips(); mode === "flash" ? (fi = 0, flashDeck()) : study(); return; }
    const f = t.closest("[data-f]"); if (f) { const a = f.dataset.f; if (a === "prev") goF(-1); else if (a === "next") goF(1); else if (a === "shuf") { shuf = !shuf; fi = 0; flashDeck(); } else if (a === "know" && fdeck[fi]) { const k = fdeck[fi].kanji; known.has(k) ? known.delete(k) : known.add(k); save(); progress(); chips(); f.textContent = known.has(k) ? "⭐ Known" : "☆ I know it"; } return; }
    if (t.closest("#fc")) return flip();
    const o = t.closest(".opt");
    if (o && !o.disabled && qz) {
      const ok = o.dataset.ok === "true", q = qz.qs[qz.i];
      document.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (b.dataset.ok === "true") b.classList.add("good"); });
      if (ok) qz.score++; else { o.classList.add("bad"); qz.wrong.push(q); }
      $("#qf").innerHTML = (ok ? "Yes!! 🎉" : `Oops! <span lang="ja">${esc(q.kanji)}</span> = ${esc(q.meaning)}`) + '<br><button type="button" class="btn go" data-q="next" style="margin-top:8px">Next ▶</button>'; return;
    }
    const qb = t.closest("[data-q]"); if (qb) { const a = qb.dataset.q; if (a === "next") { qz.i++; ask(); } else if (a === "again") startQuiz(); else setMode("study"); }
  });
  $("#q").addEventListener("input", study);
  document.addEventListener("keydown", e => {
    if (mode !== "flash" || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") goF(1); else if (e.key === "ArrowLeft") goF(-1); else if ((e.key === " " || e.key === "Enter") && e.target.id === "fc") { e.preventDefault(); flip(); }
  });
  const readFile = f => f && f.text().then(t => init(JSON.parse(t))).catch(() => fail("Couldn't read that file. Is it the kanji JSON?"));
  document.addEventListener("change", e => { if (e.target.id === "pick" || e.target.id === "pick2") readFile(e.target.files[0]); });

  async function boot() {
    for (const u of CFG.data) { try { const r = await fetch(u, {cache: "no-cache"}); if (r.ok) return init(await r.json()); } catch (e) {} }
    fail("Couldn't load the kanji list from /assets.");
  }
  boot();

  /* ---- stickers (decoration only) ---- */
  const k2 = innerWidth < 600 ? .7 : 1, fx = document.createElement("div"); fx.id = "fx"; fx.setAttribute("aria-hidden", "true");
  const sp = [["cloud.png",3,2,96,0,""],["rainbow.png",74,1,130,5,""],["sun.png",44,2,66,-8,"spin"],["yellow_love.png",8,28,38,-10,"tw"],["love.png",92,36,40,10,"tw"],
    ["flower.png",3,74,64,0,""],["cat.png",85,66,86,-6,""],["leaf.png",20,92,50,8,""],["flower.png",72,90,64,0,""],["dog.png",1,88,80,6,""]];
  fx.innerHTML = sp.map((s, i) => `<img class="fx-s ${s[5]}" src="${CFG.assets}${s[0]}" alt="" style="left:${s[1]}%;top:${s[2]}%;width:${Math.round(s[3] * k2)}px;--r:${s[4]}deg;--d:-${(i * 7) % 5}s">`).join("");
  fx.addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.style.visibility = "hidden"; }, true);
  document.body.appendChild(fx);
})();
</script>
